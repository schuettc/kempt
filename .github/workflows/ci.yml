name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    # kempt only runs on macOS, and its tests exercise macOS behaviour.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7.0.1
      # The family Go gate: gofmt, vet, golangci-lint (family config), race
      # tests, and a build for every release target.
      - uses: schuettc/tools-actions/go-ci@v0.2.2
