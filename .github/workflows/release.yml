name: release

# MANUAL-ONLY during pre-launch. kempt is still in private development on a
# public repo; we do NOT want a push to main to cut a public release yet. This
# workflow runs only on workflow_dispatch, so releases are cut deliberately
# (e.g. a throwaway test release to validate install.sh + kempt update, later
# a real v<VERSION> after the history wipe + public flip). When launching for
# real, restore the `push: branches: [main]` trigger so a VERSION bump releases.
#
# The VERSION file is the knob: the workflow tags v<VERSION>; if that release
# already exists it is a no-op. Binaries are cross-compiled cgo-free
# (darwin/linux × arm64/amd64), each with a sha256 checksum, stamped with
# version/commit via -ldflags -X into internal/version.
#
# kempt is a single, UNSIGNED binary — there is no macOS signing/notarization
# and nothing that needs a macOS runner, so the whole job cross-compiles from
# ubuntu-latest.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(tr -d ' \n' < VERSION)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "VERSION $tag already released — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        if: steps.rel.outputs.skip == 'false'
        with:
          go-version-file: go.mod
      - name: Build and package all targets
        if: steps.rel.outputs.skip == 'false'
        run: |
          set -euo pipefail
          tag="${{ steps.rel.outputs.tag }}"
          version="${tag#v}"
          commit="$(git rev-parse --short HEAD)"
          ldflags="-s -w -X github.com/schuettc/kempt/internal/version.version=${version} -X github.com/schuettc/kempt/internal/version.commit=${commit}"
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            goos="${target%/*}"; goarch="${target#*/}"
            out="kempt_${goos}_${goarch}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "$ldflags" -o "dist/${out}/kempt" ./cmd/kempt
            tar -C "dist/${out}" -czf "dist/${out}.tar.gz" kempt
          done
          # shellcheck disable=SC2035  # *.tar.gz inside cd dist; no dash-prefixed names possible
          (cd dist && (shasum -a 256 *.tar.gz 2>/dev/null || sha256sum *.tar.gz) > checksums.txt)
      - name: Create the release
        if: steps.rel.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.rel.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "kempt ${{ steps.rel.outputs.tag }}" --generate-notes
      - name: Upload assets
        if: steps.rel.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.rel.outputs.tag }}" dist/*.tar.gz dist/checksums.txt --clobber --repo "$GITHUB_REPOSITORY"
